<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">

<style>
  :root{
    color-scheme:light;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-right:env(safe-area-inset-right,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-left:env(safe-area-inset-left,0px);
  }
  html,body{margin:0;padding:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#E4EAE4;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none;}
  body{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;outline:none;}
  .install-button{
    position:fixed;z-index:4;left:50%;bottom:calc(var(--safe-bottom) + 22px);transform:translateX(-50%);
    display:flex;align-items:center;gap:9px;border:1px solid rgba(65,83,73,.14);border-radius:999px;
    padding:11px 18px;background:rgba(248,242,231,.88);color:#43534B;font:700 14px/1 system-ui,sans-serif;
    box-shadow:0 10px 30px rgba(52,71,61,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    touch-action:manipulation;cursor:pointer;transition:opacity .2s ease,transform .2s ease;
  }
  .install-button:active{transform:translateX(-50%) scale(.96)}
  .install-button[hidden],.install-sheet[hidden],.reset-button[hidden],.reset-sheet[hidden],.home-button[hidden],
  .demo-ad[hidden],.parent-sheet[hidden],.toast[hidden]{display:none}
  .install-button svg{width:18px;height:18px;stroke:currentColor}
  .install-sheet{position:fixed;z-index:8;inset:0;display:grid;place-items:end center;padding:18px;
    padding-bottom:calc(var(--safe-bottom) + 18px);background:rgba(50,64,57,.28);backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);touch-action:manipulation;}
  .install-card{position:relative;width:min(100%,420px);box-sizing:border-box;padding:24px 22px 22px;border-radius:28px;
    background:#F8F2E7;color:#43534B;text-align:center;box-shadow:0 20px 70px rgba(40,56,48,.24)}
  .install-card img{width:76px;height:76px;border-radius:20px;box-shadow:0 8px 22px rgba(52,71,61,.18)}
  .install-card h1{margin:14px 0 7px;font-size:21px}.install-card p{margin:0;line-height:1.5;font-size:15px}
  .close-button{position:absolute;right:12px;top:12px;width:40px;height:40px;border:0;border-radius:50%;
    color:#43534B;background:rgba(94,107,100,.10);font-size:24px;line-height:1;touch-action:manipulation;cursor:pointer}
  .reset-button,.home-button{position:fixed;z-index:5;bottom:calc(var(--safe-bottom) + 14px);
    display:grid;place-items:center;width:48px;height:48px;border:1px solid rgba(65,83,73,.14);border-radius:50%;
    background:rgba(248,242,231,.88);color:#43534B;box-shadow:0 8px 24px rgba(52,71,61,.16);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);touch-action:manipulation;cursor:pointer}
  .reset-button{left:calc(var(--safe-left) + 14px)}.home-button{right:calc(var(--safe-right) + 14px)}
  .reset-button:active,.home-button:active{transform:scale(.94)}
  .reset-button svg,.home-button svg{width:23px;height:23px;stroke:currentColor}
  .reset-sheet{position:fixed;z-index:8;inset:0;display:grid;place-items:end center;padding:18px;
    padding-bottom:calc(var(--safe-bottom) + 18px);background:rgba(50,64,57,.28);backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);touch-action:manipulation}
  .reset-card{position:relative;width:min(100%,420px);box-sizing:border-box;padding:26px 20px 20px;border-radius:28px;
    background:#F8F2E7;color:#43534B;text-align:center;box-shadow:0 20px 70px rgba(40,56,48,.24)}
  .reset-card h1{margin:0 0 7px;font-size:21px}.reset-card p{margin:0 0 18px;line-height:1.45;font-size:14px}
  .reset-actions{display:grid;gap:10px}.action-button{width:100%;border:0;border-radius:16px;padding:14px 16px;
    background:#86BFA8;color:#283D34;font:750 15px/1.1 system-ui,sans-serif;touch-action:manipulation;cursor:pointer}
  .action-button.secondary{background:rgba(94,107,100,.10);color:#43534B}.action-button.danger{background:#EDA0A8;color:#4F2F34}
  .demo-ad{position:fixed;z-index:20;inset:0;display:grid;grid-template-rows:auto 1fr auto;box-sizing:border-box;
    padding:calc(var(--safe-top) + 16px) 18px calc(var(--safe-bottom) + 18px);background:linear-gradient(160deg,#263B36,#58796D);
    color:white;touch-action:manipulation;overflow:hidden}
  .ad-top{display:flex;align-items:center;justify-content:space-between;min-height:48px}.ad-badge{font:800 11px/1 system-ui,sans-serif;
    letter-spacing:.14em;padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.14)}
  .ad-timer,.ad-close{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.16);
    color:white;font:800 18px/1 system-ui,sans-serif}.ad-close{font-size:27px;cursor:pointer}
  .ad-creative{position:relative;display:grid;place-items:center;min-height:0}.ad-orbit{position:relative;width:min(70vw,300px);aspect-ratio:1;
    border:2px solid rgba(255,255,255,.14);border-radius:50%;animation:ad-spin 7s linear infinite}
  .ad-shape{position:absolute;width:30%;aspect-ratio:1;border-radius:32%;box-shadow:0 16px 40px rgba(0,0,0,.22)}
  .ad-shape.a{left:4%;top:15%;background:#EFC978;animation:ad-float 1.9s ease-in-out infinite alternate}
  .ad-shape.b{right:2%;top:38%;border-radius:50%;background:#8FB8DE;animation:ad-float 2.3s .3s ease-in-out infinite alternate}
  .ad-shape.c{left:35%;bottom:-4%;background:#EDA0A8;transform:rotate(45deg);animation:ad-float 2.1s .6s ease-in-out infinite alternate}
  .ad-logo{position:absolute;inset:28%;width:44%;height:44%;border-radius:26%;box-shadow:0 18px 45px rgba(0,0,0,.24)}
  .remove-ads{justify-self:center;border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:12px 18px;
    background:rgba(255,255,255,.12);color:white;font:750 13px/1 system-ui,sans-serif;cursor:pointer}
  .parent-sheet{position:fixed;z-index:24;inset:0;display:grid;place-items:center;padding:18px;background:rgba(25,39,34,.72);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);touch-action:manipulation}
  .parent-card{width:min(100%,390px);box-sizing:border-box;padding:26px 22px;border-radius:28px;background:#F8F2E7;color:#43534B;
    text-align:center;box-shadow:0 22px 70px rgba(0,0,0,.28)}
  .parent-card h1{margin:0 0 8px;font-size:22px}.parent-card p{margin:0 0 16px;font:500 14px/1.45 system-ui,sans-serif}
  .parent-card input{width:100%;box-sizing:border-box;margin-bottom:12px;border:2px solid rgba(67,83,75,.15);border-radius:16px;
    padding:13px;text-align:center;background:white;color:#43534B;font:800 22px/1 system-ui,sans-serif;outline:none}
  .parent-actions{display:grid;gap:9px}
  @keyframes ad-spin{to{transform:rotate(360deg)}}@keyframes ad-float{to{translate:0 -18px;rotate:10deg}}
  .toast{position:fixed;z-index:9;top:calc(var(--safe-top) + 14px);left:50%;transform:translateX(-50%);
    max-width:calc(100% - 36px);padding:10px 14px;border-radius:999px;background:rgba(67,83,75,.92);color:white;
    font:650 13px/1.2 system-ui,sans-serif;box-shadow:0 8px 26px rgba(40,56,48,.22);pointer-events:none}
  @media (prefers-reduced-motion:reduce){.install-button{transition:none}.ad-orbit,.ad-shape{animation:none}}
  @media (orientation:landscape){.home-button{top:calc(var(--safe-top) + 14px);bottom:auto}}
</style>

<body>
<canvas id="c" role="application" tabindex="0" aria-label="EvisGame eşleştirme oyunu. Başlamak için ekrana dokunun.">
  Tarayıcınız Canvas özelliğini desteklemiyor.
</canvas>
<button id="installButton" class="install-button" type="button" hidden aria-label="EvisGame uygulamasını yükle">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span>Uygulamayı yükle</span>
</button>
<section id="installSheet" class="install-sheet" hidden aria-modal="true" role="dialog" aria-labelledby="installTitle">
  <div class="install-card">
    <button id="closeInstall" class="close-button" type="button" aria-label="Kapat">×</button>
    <img src="icons/icon-192.png" alt="EvisGame logosu" width="76" height="76">
    <h1 id="installTitle">EvisGame’i yükle</h1>
    <p id="installHelp">Tarayıcı menüsünden “Ana Ekrana Ekle” seçeneğini kullanın.</p>
  </div>
</section>
<button id="resetButton" class="reset-button" type="button" hidden aria-label="Bölümü veya ilerlemeyi sıfırla">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4v6h6M5.2 15a8 8 0 1 0 .3-6.5L4 10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<section id="resetSheet" class="reset-sheet" hidden aria-modal="true" role="dialog" aria-labelledby="resetTitle">
  <div class="reset-card">
    <button id="closeReset" class="close-button" type="button" aria-label="Kapat">×</button>
    <h1 id="resetTitle">Yeniden başlat</h1>
    <p>Bölümü tekrar oynayabilir veya kazanılan bütün ilerlemeyi sıfırlayabilirsiniz.</p>
    <div class="reset-actions">
      <button id="restartLevel" class="action-button" type="button">Bu bölümü yeniden başlat</button>
      <button id="resetProgress" class="action-button danger" type="button">Tüm ilerlemeyi sıfırla</button>

<button id="homeButton" class="home-button" type="button" hidden aria-label="Ana menüye dön">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2M6 10v9h4.2v-5h3.6v5H18v-9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<section id="demoAd" class="demo-ad" hidden aria-modal="true" role="dialog" aria-label="Demo reklam">
  <div class="ad-top"><span class="ad-badge">DEMO REKLAM</span><span id="adTimer" class="ad-timer">8</span><button id="adClose" class="ad-close" type="button" hidden aria-label="Reklamı kapat">×</button></div>
  <div class="ad-creative" aria-hidden="true"><div class="ad-orbit"><i class="ad-shape a"></i><i class="ad-shape b"></i><i class="ad-shape c"></i></div><img class="ad-logo" src="icons/icon-192.png" alt=""></div>
  <button id="removeAds" class="remove-ads" type="button">Reklamları kaldır · Demo</button>
</section>
<section id="parentSheet" class="parent-sheet" hidden aria-modal="true" role="dialog" aria-labelledby="parentTitle">
  <div class="parent-card"><h1 id="parentTitle">Ebeveyn alanı</h1><p id="parentPrompt"></p>
    <input id="parentAnswer" type="number" inputmode="numeric" autocomplete="off" aria-label="İşlemin cevabı">
    <div class="parent-actions"><button id="parentConfirm" class="action-button" type="button">Devam et</button><button id="parentCancel" class="action-button secondary" type="button">Vazgeç</button></div>
  </div>
</section>
<div id="statusToast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
"use strict";

/* ==========================================================================
   EŞLEŞTİR  ·  2-4 yaş  ·  çevrimdışı oyun
   11 oyun tipi · temel oyunlar + playground.js
   Yazı yok · kaybetme yok · süre yok · ceza yok
   ========================================================================== */

/* ---------------- palet ---------------- */
const BG_TOP  = '#E8F8FF';
const BG_BOT  = '#C7EDDC';
const INK     = '#344968';
const CREAM   = '#F8F2E7';
const PALETTE = ['#FF906C','#FFD15C','#60CBA2','#65B7F4','#B49AF5','#F88DB1'];
const SHAPES  = ['circle','square','triangle','star','heart','flower','hexagon'];
const ANIMALS = ['cat','dog','bear','rabbit','mouse','frog'];
const isAnimal = s => ANIMALS.indexOf(s) >= 0;

const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const STORAGE_KEY='evisgame-progress-v1';
const ADS_DEMO_KEY='evisgame-ads-disabled-demo-v1';
function loadProgress(){
  try{
    const value=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    return value && Number.isFinite(value.levelIndex) && Number.isFinite(value.stars) ? value : {levelIndex:0,stars:0,modeRounds:{}};
  }catch(e){ return {levelIndex:0,stars:0,modeRounds:{}}; }
}
const savedProgress=loadProgress();
let modeRounds=savedProgress.modeRounds&&typeof savedProgress.modeRounds==='object'?savedProgress.modeRounds:{};
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY,JSON.stringify({levelIndex,stars,modeRounds,sensoryTotals,updatedAt:Date.now()})); }catch(e){}
}

/* ---------------- yardımcı ---------------- */
const rnd   = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const pick  = a=>a[(Math.random()*a.length)|0];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
const ease  = (cur,tgt,lam,dt)=>cur+(tgt-cur)*(1-Math.exp(-lam*dt));
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

/* ---------------- ses ---------------- */
let AC=null, master=null;
function audioInit(){
  if(AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.28; master.connect(AC.destination);
  }catch(e){}
}
function tone(freq,dur,type,vol,delay,glide){
  if(!AC) return;
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if(glide) o.frequency.exponentialRampToValueAtTime(glide,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.5,t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.05);
}
function note(f,delay,vol){ tone(f,0.55,'sine',vol||0.55,delay); tone(f*2,0.22,'sine',(vol||0.55)*0.22,delay); }
const PENTA=[523.25,587.33,659.25,783.99,880.00,1046.50];
const sndPick =()=>tone(660,0.10,'sine',0.20,0,880);
const sndSoft =()=>tone(200,0.16,'sine',0.16,0,150);
const sndSel  =()=>{tone(740,0.09,'sine',0.18,0,900);tone(1100,0.07,'sine',0.08,0.05);};
const sndMatch=i=>{note(PENTA[i%PENTA.length],0,0.5); note(PENTA[(i+2)%PENTA.length],0.07,0.3);};
const sndGiggle=()=>{[880,1046,1318].forEach((f,i)=>tone(f,0.10,'sine',0.22,i*0.06,f*1.15));};
function sndWin(){ [0,2,4,5].forEach((n,i)=>note(PENTA[n],i*0.11,0.5)); note(PENTA[0]*2,0.44,0.35); }
function sndStar(){ [0,2,4,5,4,5].forEach((n,i)=>note(PENTA[n]*(i>3?2:1),i*0.09,0.42)); }

/* ---------------- canvas ---------------- */
const cvs=document.getElementById('c'), ctx=cvs.getContext('2d',{alpha:false});
const safe={top:0,right:0,bottom:0,left:0};
const logoImg=new Image(); logoImg.decoding='async'; logoImg.src='icons/icon-512.png';
let W=0,H=0,DPR=1,bgCanvas=null;

function readSafeArea(){
  const st=getComputedStyle(document.documentElement);
  safe.top=parseFloat(st.getPropertyValue('--safe-top'))||0;
  safe.right=parseFloat(st.getPropertyValue('--safe-right'))||0;
  safe.bottom=parseFloat(st.getPropertyValue('--safe-bottom'))||0;
  safe.left=parseFloat(st.getPropertyValue('--safe-left'))||0;
}

function resize(){
  if(typeof buildBackground!=='function') return; // viewport events can fire before the scene scripts load
  readSafeArea();
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cvs.width=Math.round(W*DPR); cvs.height=Math.round(H*DPR);
  cvs.style.width=W+'px'; cvs.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildBackground();
  if(level) layout();
  if(typeof syncMenuButtons==='function') syncMenuButtons();
}
/* ---------------- şekil yolları ---------------- */
function roundRectPath(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
const polyPts=(n,r,off)=>{const p=[];for(let i=0;i<n;i++){const a=off+i*Math.PI*2/n;p.push([Math.cos(a)*r,Math.sin(a)*r]);}return p;};
const starPts=(n,ro,ri)=>{const p=[];for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,r=i%2?ri:ro;p.push([Math.cos(a)*r,Math.sin(a)*r]);}return p;};
function roundPolyPath(c,pts,r){
  const n=pts.length;
  c.moveTo((pts[0][0]+pts[1][0])/2,(pts[0][1]+pts[1][1])/2);
  for(let i=0;i<n;i++){const cur=pts[(i+1)%n],nxt=pts[(i+2)%n];c.arcTo(cur[0],cur[1],nxt[0],nxt[1],r);}
  c.closePath();
}
/* hayvan siluetleri — tüm alt yollar aynı yönde, nonzero ile birleşiyor */
function animalPath(c,kind,s){
  const R=s*0.84;
  const ear=(px,py,rx,ry,rot)=>{c.moveTo(px+rx,py);c.ellipse(px,py,rx,ry,rot||0,0,Math.PI*2);};
  const tri=(px,py,w,h)=>{c.moveTo(px,py-h);c.lineTo(px+w,py+h*0.6);c.lineTo(px-w,py+h*0.6);c.closePath();};
  switch(kind){
    case 'cat':    tri(-R*0.56,-R*0.60,R*0.34,R*0.48); tri(R*0.56,-R*0.60,R*0.34,R*0.48); break;
    case 'bear':   ear(-R*0.70,-R*0.62,R*0.36,R*0.36); ear(R*0.70,-R*0.62,R*0.36,R*0.36); break;
    case 'mouse':  ear(-R*0.74,-R*0.50,R*0.48,R*0.48); ear(R*0.74,-R*0.50,R*0.48,R*0.48); break;
    case 'rabbit': ear(-R*0.34,-R*0.98,R*0.21,R*0.64,-0.16); ear(R*0.34,-R*0.98,R*0.21,R*0.64,0.16); break;
    case 'dog':    ear(-R*0.84,-R*0.02,R*0.29,R*0.54,-0.28); ear(R*0.84,-R*0.02,R*0.29,R*0.54,0.28); break;
    case 'frog':   ear(-R*0.54,-R*0.68,R*0.35,R*0.35); ear(R*0.54,-R*0.68,R*0.35,R*0.35); break;
  }
  if(kind==='frog'){ c.moveTo(R*1.06,R*0.10); c.ellipse(0,R*0.10,R*1.06,R*0.84,0,0,Math.PI*2); }
  else { c.moveTo(R,0); c.ellipse(0,0,R,R*0.95,0,0,Math.PI*2); }
}
function animalFace(c,kind,s,blink){
  const R=s*0.84;
  const frog=kind==='frog';
  const ex=frog?R*0.54:R*0.31, ey=frog?-R*0.68:-R*0.06, er=R*(frog?0.17:0.12);
  c.fillStyle='rgba(52,62,56,0.88)';
  for(const sg of [-1,1]){
    c.beginPath();
    if(blink>0.5){ c.save(); c.lineCap='round'; c.lineWidth=er*0.8; c.strokeStyle='rgba(52,62,56,0.88)';
      c.moveTo(sg*ex-er,ey); c.lineTo(sg*ex+er,ey); c.stroke(); c.restore(); }
    else { c.arc(sg*ex,ey,er,0,Math.PI*2); c.fill();
      c.beginPath(); c.fillStyle='rgba(255,255,255,0.85)';
      c.arc(sg*ex-er*0.3,ey-er*0.35,er*0.34,0,Math.PI*2); c.fill();
      c.fillStyle='rgba(52,62,56,0.88)'; }
  }
  if(!frog){ c.beginPath(); c.fillStyle='rgba(52,62,56,0.55)';

function shapePath(c,shape,s){

    case 'square':   roundRectPath(c,-s*.84,-s*.84,s*1.68,s*1.68,s*.30); break;
    case 'triangle': roundPolyPath(c,polyPts(3,s*1.10,-Math.PI/2),s*.26); break;
    case 'hexagon':  roundPolyPath(c,polyPts(6,s*1.02,-Math.PI/2),s*.22); break;
    case 'star':     roundPolyPath(c,starPts(5,s*1.12,s*.52),s*.14); break;

      c.bezierCurveTo(k*.62,-k*1.28,k*1.62,-k*.28,0,k*.82); c.closePath(); break;
    }
    case 'flower': {
      for(let i=0;i<6;i++){const a=i*Math.PI/3,px=Math.cos(a)*s*.56,py=Math.sin(a)*s*.56;
        c.moveTo(px+s*.47,py); c.arc(px,py,s*.47,0,Math.PI*2);}
      c.moveTo(s*.44,0); c.arc(0,0,s*.44,0,Math.PI*2); break;

}

const DIGIT_PATHS={
  0:[[[.50,.15],[.34,.20],[.27,.42],[.28,.68],[.40,.82],[.60,.82],[.72,.68],[.73,.40],[.65,.21],[.50,.15]]],
  1:[[[.34,.29],[.51,.16],[.54,.16],[.54,.80]],[[.35,.80],[.72,.80]]],
  2:[[[.29,.31],[.37,.18],[.55,.15],[.70,.24],[.71,.38],[.62,.51],[.31,.78],[.73,.78]]],
  3:[[[.31,.24],[.45,.15],[.62,.18],[.70,.30],[.65,.44],[.51,.49],[.66,.51],[.73,.64],[.68,.77],[.54,.83],[.35,.78]]],
  4:[[[.65,.80],[.65,.16]],[[.64,.18],[.28,.59],[.76,.59]]],
  5:[[[.70,.17],[.36,.17],[.32,.47],[.55,.45],[.69,.55],[.70,.70],[.60,.81],[.42,.82],[.30,.75]]],
  6:[[[.66,.20],[.50,.16],[.36,.27],[.29,.48],[.31,.69],[.43,.81],[.60,.81],[.70,.70],[.69,.55],[.58,.46],[.39,.49],[.30,.60]]],
  7:[[[.29,.18],[.73,.18],[.59,.42],[.47,.80]]],

function pointOnDigit(digit,t){
  const paths=DIGIT_PATHS[digit]||DIGIT_PATHS[1],segments=[]; let total=0;
  for(const path of paths) for(let i=1;i<path.length;i++){
    const a=path[i-1],b=path[i],len=Math.hypot(b[0]-a[0],b[1]-a[1]); segments.push({a,b,len}); total+=len;
  }
  let at=((t%1)+1)%1*total;
  for(const segment of segments){ if(at<=segment.len){ const q=segment.len?at/segment.len:0;
      return {x:segment.a[0]+(segment.b[0]-segment.a[0])*q,y:segment.a[1]+(segment.b[1]-segment.a[1])*q}; } at-=segment.len; }
  const p=paths[0][0]; return {x:p[0],y:p[1]};
}

const parts=[];
function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2), sp=rnd(60,300);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,g:340,r:rnd(3,9),c:color,
      life:0,max:rnd(.5,.95),rot:rnd(0,7),vr:rnd(-8,8),sq:Math.random()<.35});
  }
}
function confetti(n){
  for(let i=0;i<n;i++)
    parts.push({x:rnd(0,W),y:rnd(-H*.3,-10),vx:rnd(-50,50),vy:rnd(60,220),g:190,
      r:rnd(4,10),c:pick(PALETTE),life:0,max:rnd(1.6,2.6),rot:rnd(0,7),vr:rnd(-6,6),sq:true,star:Math.random()<.22});
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life+=dt;
    if(p.life>=p.max){parts.splice(i,1);continue;}
    p.vy+=p.g*dt; p.vx*=Math.pow(0.30,dt); p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
  }
}
function drawParts(){
  for(const p of parts){
    const t=p.life/p.max, a=1-t*t, sc=1-t*0.45;
    ctx.save(); ctx.globalAlpha=a; ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
    // Paper confetti tumbles in 3D: its visible height follows the spin.
    if(p.sq&&!REDUCED) ctx.scale(1,.25+.75*Math.abs(Math.cos(p.rot*1.7+p.r)));
    if(p.star){ starPath(ctx,p.r*sc*1.2); }
    else { ctx.beginPath();
      if(p.sq) roundRectPath(ctx,-p.r*sc,-p.r*sc*.6,p.r*2*sc,p.r*1.2*sc,p.r*.35);
      else ctx.arc(0,0,p.r*sc,0,Math.PI*2); }
    ctx.fill();
    if(!p.sq&&!p.star&&p.r>5){ ctx.beginPath(); ctx.arc(-p.r*sc*.3,-p.r*sc*.3,p.r*sc*.3,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,.45)'; ctx.fill(); }
    ctx.restore();

}

const mas={x:0,y:0,s:0,blink:0,nextBlink:2.5,mood:0,bounce:0,sway:0,
           lx:0,ly:0,tlx:0,tly:0,tilt:0};
function mascotLook(x,y){ mas.tlx=x; mas.tly=y; }
function mascotCheer(){ mas.mood=1.6; mas.bounce=1; }
function updateMascot(dt){
  const usableH=H-safe.top-safe.bottom;
  mas.s=Math.min(W,usableH)*0.062; mas.x=W*0.5; mas.y=safe.top+usableH*0.138;
  mas.blink=Math.max(0,mas.blink-dt*7);
  mas.nextBlink-=dt;
  if(mas.nextBlink<=0){ mas.blink=1; mas.nextBlink=rnd(2.2,5.5); }
  mas.mood=Math.max(0,mas.mood-dt);
  mas.bounce=Math.max(0,mas.bounce-dt*2.2);
  const dx=clamp((mas.tlx-mas.x)/(W*0.5),-1,1), dy=clamp((mas.tly-mas.y)/(H*0.45),-1,1);
  mas.lx=ease(mas.lx,dx,9,dt); mas.ly=ease(mas.ly,dy,9,dt);
  mas.tilt=ease(mas.tilt,dx*0.13,7,dt);
}
function drawMascot(time){
  const s=mas.s, b=Math.sin(clamp(mas.bounce,0,1)*Math.PI);
  const breathe=REDUCED?1:1+Math.sin(time*2.1)*0.035;
  ctx.save();
  ctx.translate(mas.x, mas.y - b*s*0.42 + (REDUCED?0:Math.sin(time*1.4)*s*0.05));
  ctx.rotate(mas.tilt + b*0.10);
  ctx.scale(1/breathe*(1+b*0.10), breathe*(1+b*0.10));

  ctx.save(); ctx.globalAlpha=0.12; ctx.translate(0,s*1.18); ctx.scale(1,0.22);
  ctx.beginPath(); ctx.arc(0,0,s*0.9,0,Math.PI*2); ctx.fillStyle='#3F4B45'; ctx.fill(); ctx.restore();

  // kulaklar + gövde
  ctx.beginPath();
  ctx.moveTo(-s*0.58+s*0.26,-s*0.66); ctx.ellipse(-s*0.58,-s*0.66,s*0.26,s*0.26,0,0,Math.PI*2);
  ctx.moveTo( s*0.58+s*0.26,-s*0.66); ctx.ellipse( s*0.58,-s*0.66,s*0.26,s*0.26,0,0,Math.PI*2);
  ctx.moveTo(s,0); ctx.ellipse(0,0,s,s*0.94,0,0,Math.PI*2);
  ctx.fillStyle=CREAM; ctx.fill();
  ctx.save(); ctx.clip();
  const lg=ctx.createLinearGradient(0,-s,0,s);
  lg.addColorStop(0,'rgba(255,255,255,0.55)'); lg.addColorStop(1,'rgba(94,107,100,0.16)');
  ctx.fillStyle=lg; ctx.fillRect(-s*1.6,-s*1.6,s*3.2,s*3.2); ctx.restore();

  // yanaklar
  ctx.globalAlpha=0.30+mas.mood*0.20; ctx.fillStyle='#EDA0A8';
  for(const sg of [-1,1]){ ctx.beginPath(); ctx.ellipse(sg*s*0.60,s*0.24,s*0.19,s*0.13,0,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;

  // gözler
  const ex=s*0.35, ey=-s*0.10, er=s*0.155;
  for(const sg of [-1,1]){
    if(mas.blink>0.35){
      ctx.strokeStyle=INK; ctx.lineWidth=s*0.075; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(sg*ex-er*0.9,ey); ctx.lineTo(sg*ex+er*0.9,ey); ctx.stroke();
    }else{
      ctx.beginPath(); ctx.arc(sg*ex,ey,er,0,Math.PI*2); ctx.fillStyle='#FFFFFF'; ctx.fill();
      ctx.beginPath(); ctx.arc(sg*ex+mas.lx*er*0.42, ey+mas.ly*er*0.42, er*0.55,0,Math.PI*2);
      ctx.fillStyle=INK; ctx.fill();
      ctx.beginPath(); ctx.arc(sg*ex+mas.lx*er*0.42-er*0.2, ey+mas.ly*er*0.42-er*0.22, er*0.18,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fill();
    }
  }
  // ağız
  ctx.strokeStyle=INK; ctx.lineWidth=s*0.08; ctx.lineCap='round'; ctx.beginPath();
  const m=clamp(mas.mood,0,1);
  ctx.arc(0,s*0.26,s*(0.16+m*0.16),0.10*Math.PI,0.90*Math.PI);
  ctx.stroke();
  ctx.restore();
}

const TYPES=['color','memory','shape','pop','size','numberdraw','count','animal','orchard','rhythm','pattern','aquarium','fireworks','paint','tumble','tower','stack','slice','hole','merge','sort'];
let level=null, levelIndex=Math.max(0,savedProgress.levelIndex|0), unit=50, stars=Math.max(0,savedProgress.stars|0);
let phase='intro', phaseT=0, idleT=0, hintOn=false, waved=[];
let activeType=null;

function pairCount(i){ return i<2?2 : i<9?3 : 4; }
function resetPhase(){ phase='intro'; phaseT=0; idleT=0; hintOn=false; waved=[]; selected=null; }

function buildMemoryLevel(idx,n){

    match:false,resolveAt:0},cheered:false};

function buildPopLevel(idx){

function buildNumberDrawingLevel(idx){

function buildLevel(idx){
  const type=activeType||TYPES[idx%TYPES.length];
  const round=activeType?Math.max(0,modeRounds[type]|0):idx;
  const n=pairCount(round);
  if(FREE_PLAY.includes(type)){ buildAdventure(type,round); return; }
  if(type==='memory'){ buildMemoryLevel(round,n); return; }
  if(type==='pop'){ buildPopLevel(round); return; }
  if(type==='numberdraw'){ buildNumberDrawingLevel(round); return; }
  const cols=shuffle(PALETTE.slice()).slice(0,Math.max(n,3));
  const defs=[];

  if(type==='color'){
    const sh=pick(['circle','flower','heart','star','hexagon']);
    for(let i=0;i<n;i++) defs.push({key:i,shape:sh,color:cols[i],sc:1,slot:cols[i]});
  }else if(type==='shape'){
    const shs=shuffle(SHAPES.slice()).slice(0,n);
    for(let i=0;i<n;i++) defs.push({key:i,shape:shs[i],color:cols[i],sc:1,slot:null});
  }else if(type==='size'){
    const sh=pick(['circle','square','star','hexagon','flower']);
    const sizes=[1,.76,.57,.43];
    for(let i=0;i<n;i++) defs.push({key:i,shape:sh,color:cols[0],sc:sizes[i],slot:null});
  }else if(type==='count'){
    for(let i=0;i<n;i++) defs.push({key:i,shape:'card',dots:i+1,color:cols[0],sc:1,slot:null});
  }else{
    const an=shuffle(ANIMALS.slice()).slice(0,n);
    for(let i=0;i<n;i++) defs.push({key:i,shape:an[i],color:cols[i],sc:1,slot:null});
  }

  const targets=shuffle(defs.slice()).map(d=>({...d,filled:false,x:0,y:0,glow:0,pulse:0}));
  const pieces =shuffle(defs.slice()).map(d=>({...d,x:0,y:0,hx:0,hy:0,placed:false,drag:false,
    pop:0,lift:0,wig:0,out:0,phase:rnd(0,7),born:0,blink:0,nextBlink:rnd(1,5)}));

  level={type,mode:'match',targets,pieces,cheered:false};
  cvs.setAttribute('aria-label','Eşleştirme oyunu. Parçaları uygun yuvalara taşıyın.');
  layout();
  pieces.forEach((p,i)=>{ p.x=p.hx; p.y=p.hy+H*0.16; p.born=-i*0.09; });
  resetPhase();
}
function layout(){
  if(!level) return;
  if(level.adventure){ layoutAdventure(); return; }
  const usableH=H-safe.top-safe.bottom;
  if(level.type==='numberdraw'){
    const g=level.drawGame;
    const boxW=Math.min(W-safe.left-safe.right-56,usableH*0.68,360);
    const boxH=Math.min(usableH*0.50,boxW*1.18);
    g.box={x:(W-boxW)/2,y:safe.top+usableH*0.285,w:boxW,h:boxH};
    g.buttonR=Math.max(24,Math.min(31,usableH*0.043));
    g.clearX=W/2; g.buttonY=safe.top+usableH*0.865;
    unit=Math.min(boxW,boxH)*0.14;
    prepareNumberMask(g);
    return;
  }
  if(level.type==='memory'){
    const count=level.pieces.length;
    const cols=count<=4?2:(count<=6?3:4), rows=Math.ceil(count/cols);
    const gap=Math.max(10,Math.min(W,usableH)*0.022);
    const cardW=Math.min(104,(W-safe.left-safe.right-gap*(cols+1))/cols,usableH*0.18);
    const cardH=cardW*1.16, totalH=rows*cardH+(rows-1)*gap;
    const startY=safe.top+usableH*0.57-totalH/2;
    unit=cardW*0.54;
    level.pieces.forEach((p,i)=>{
      const row=(i/cols)|0, col=i%cols;
      p.w=cardW; p.h=cardH; p.hx=W/2+(col-(cols-1)/2)*(cardW+gap); p.hy=startY+row*(cardH+gap)+cardH/2;
    });
    return;
  }
  if(level.type==='pop'){
    const cols=3, rows=2, gapX=(W-safe.left-safe.right)/cols, gapY=usableH*0.22;
    unit=Math.min(gapX*0.29,usableH*0.072,58);
    level.pieces.forEach((p,i)=>{
      p.r=unit; p.hx=safe.left+gapX*(i%cols+0.5); p.hy=safe.top+usableH*0.49+((i/cols)|0)*gapY;
      if(!p.x&&!p.y){ p.x=p.hx; p.y=p.hy; }
    });
    return;
  }
  const n=level.targets.length;
  unit=Math.min((W-safe.left-safe.right)/(n*2.50), usableH*0.086, 76);
  const ty=safe.top+usableH*0.375, py=safe.top+usableH*0.755;
  level.targets.forEach((t,i)=>{ t.x=W*(i+.5)/n; t.y=ty; });
  level.pieces.forEach((p,i)=>{
    p.hx=W*(i+.5)/n; p.hy=py;
    if(p.placed){ const t=slotOf(p); p.x=t.x; p.y=t.y; }
  });
}
const slotOf = p => level.targets.find(t=>t.key===p.key);

/* ---------------- çizim ---------------- */
function drawSlot(t,time){
  const s=unit*t.sc*(1+t.pulse*0.10+t.glow*0.08);
  ctx.save();
  ctx.translate(t.x, t.y + (REDUCED?0:Math.sin(time*1.1+t.key)*1.5));
  const col=t.slot||INK;
  ctx.globalAlpha=(t.slot?0.20:0.13)*(1-(level.fade||0));
  shapePath(ctx,t.shape,s); ctx.fillStyle=col; ctx.fill();
  ctx.globalAlpha=((t.slot?0.55:0.32)+t.glow*0.42)*(1-(level.fade||0));
  ctx.lineWidth=Math.max(2.5,unit*0.075); ctx.strokeStyle=col; ctx.lineJoin='round';
  shapePath(ctx,t.shape,s); ctx.stroke();
  if(t.dots){
    ctx.globalAlpha=0.28*(1-(level.fade||0));
    dotLayout(t.dots,s).forEach(([dx,dy])=>{ ctx.beginPath(); ctx.arc(dx,dy,s*0.19,0,Math.PI*2); ctx.fillStyle=INK; ctx.fill(); });
  }
  if(t.glow>0.01){
    ctx.globalAlpha=t.glow*0.34; ctx.lineWidth=Math.max(6,unit*0.22); ctx.strokeStyle=col;
    shapePath(ctx,t.shape,s*1.12); ctx.stroke();
  }
  ctx.restore();
}
function drawPiece(p,time){
  const born=clamp(p.born,0,1); if(born<=0) return;
  const bs=born<1?(1.70*born**3-2.55*born**2+1.85*born):1;
  const bob=(p.placed||REDUCED)?0:Math.sin(time*1.6+p.phase)*unit*0.045;
  const pop=Math.sin(clamp(p.pop,0,1)*Math.PI);
  const out=clamp(p.out,0,1);
  const sc=unit*p.sc*bs*(1+p.lift*0.16+pop*0.22)*(1-out);
  if(sc<=0.4) return;
  const wig=REDUCED?0:Math.sin(p.wig*26)*p.wig*0.28;

  ctx.save();
  ctx.globalAlpha=1-out*out;
  ctx.translate(p.x, p.y+bob-out*unit*1.2);
  ctx.rotate(wig + (REDUCED?0:p.lift*0.05*Math.sin(time*5)));

  ctx.save(); ctx.globalAlpha=(0.13+p.lift*0.10)*(1-out);
  ctx.translate(0,sc*0.95+p.lift*unit*0.30); ctx.scale(1,0.25);
  ctx.beginPath(); ctx.arc(0,0,sc*(0.86+p.lift*0.22),0,Math.PI*2);
  ctx.fillStyle='#3F4B45'; ctx.fill(); ctx.restore();

  ctx.translate(0,-p.lift*unit*0.16);
  shapePath(ctx,p.shape,sc); ctx.fillStyle=p.color; ctx.fill();
  ctx.save(); shapePath(ctx,p.shape,sc); ctx.clip();
  const lg=ctx.createLinearGradient(0,-sc,0,sc);
  lg.addColorStop(0,'rgba(255,255,255,0.42)');
  lg.addColorStop(0.5,'rgba(255,255,255,0.05)');
  lg.addColorStop(1,'rgba(60,70,64,0.16)');
  ctx.fillStyle=lg; ctx.fillRect(-sc*1.4,-sc*1.4,sc*2.8,sc*2.8);
  ctx.restore();

  if(g.feedback==='transform'||g.feedback==='success') return;
  if(Math.hypot(e.clientX-g.clearX,e.clientY-g.buttonY)<g.buttonR*1.3){ clearNumberDrawing(true); return; }
  if(e.clientX<b.x||e.clientX>b.x+b.w||e.clientY<b.y||e.clientY>b.y+b.h||g.pointerId!==null) return;
  if(g.feedback==='retry') clearNumberDrawing(false);
  g.autoCheckAt=0;
  const point=numberPoint(e),stroke=numberPointAllowed(g,point)?[point]:null;
  if(stroke) g.strokes.push(stroke); else g.pulse=0.55;
  g.active=stroke; g.pointerId=e.pointerId; g.feedback='drawing';
  sndPick(); try{cvs.setPointerCapture(e.pointerId);}catch(err){}
}
function handleNumberMove(e){
  const g=level.drawGame; if(g.pointerId!==e.pointerId) return false;
  e.preventDefault(); const point=numberPoint(e);
  if(!numberPointAllowed(g,point)){ g.active=null; return true; }
  if(!g.active){ g.active=[point]; g.strokes.push(g.active); return true; }
  const last=g.active[g.active.length-1],dist=Math.hypot(point.x-last.x,point.y-last.y);
  if(dist>=2){
    if(!numberSegmentAllowed(g,last,point)){g.active=[point];g.strokes.push(g.active);return true;}
    g.active.push(point); g.pathLength+=dist; mascotLook(e.clientX,e.clientY);
  }
  return true;
}
function handleNumberUp(e){
  const g=level.drawGame; if(g.pointerId!==e.pointerId) return false;
  g.active=null; g.pointerId=null; try{if(cvs.hasPointerCapture(e.pointerId))cvs.releasePointerCapture(e.pointerId);}catch(err){}
  if(g.strokes.some(s=>s.length>1)) g.autoCheckAt=time+1.15;
  return true;
}
function updateNumberDrawing(dt){
  const g=level.drawGame; g.pulse=Math.max(0,g.pulse-dt*1.8);
  if(phase==='play'&&g.autoCheckAt&&time>=g.autoCheckAt) checkNumberDrawing();
  if(g.retryAt&&time>=g.retryAt) clearNumberDrawing(false);
  if(g.feedback==='transform'&&time-g.transformStart>=g.transformDuration){
    g.feedback='success'; phase='win'; phaseT=0;
    burst(g.box.x+g.box.w/2,g.box.y+g.box.h/2,PALETTE[2],REDUCED?5:34); mascotCheer();
  }
}

function place(p,t){
  p.placed=true; p.drag=false; t.filled=true; p.pop=1; t.pulse=1;
  if(selected===p) selected=null;
  const done=level.targets.filter(x=>x.filled).length;
  sndMatch(done-1); buzz(14); burst(t.x,t.y,p.color,REDUCED?3:22);
  mascotCheer(); mascotLook(t.x,t.y);
  if(level.targets.every(x=>x.filled)){ phase='win'; phaseT=0; }
}
function autoPlace(p){ const t=slotOf(p); if(t && !t.filled) place(p,t); }

function startGame(){
  if(started) return;
  audioInit(); if(AC&&AC.state==='suspended') AC.resume();
  started=true; installButton.hidden=true; goFullscreen(); keepAwake(); openMenu('menu');
  try{ cvs.focus({preventScroll:true}); }catch(e){ cvs.focus(); }
  note(PENTA[0],0,0.4); note(PENTA[3],0.09,0.35);
}

function onDown(e){
  e.preventDefault();
  audioInit(); if(AC&&AC.state==='suspended') AC.resume();
  const x=e.clientX, y=e.clientY; idleT=0; hintOn=false;
  if(!started){ startGame(); return; }
  if(['menu','matchMenu','learnMenu','moreMenu'].includes(appView)){ handleMenuTap(x,y); return; }
  if(appView!=='game'||!level) return;
  if(phase!=='play') return;
  if(level.adventure){ startTouch(e); return; }
  if(level.type==='memory'){ handleMemoryTap(x,y); return; }
  if(level.type==='pop'){ handlePopTap(x,y); return; }
  if(level.type==='numberdraw'){ handleNumberDown(e); return; }
  let grabbed=null;
  for(let i=level.pieces.length-1;i>=0;i--){
    const p=level.pieces[i];
    if(p.placed||p.drag) continue;
    if(hitPiece(p,x,y)){
      grabbed=p; p.drag=true; p.wig=0;
      level.pieces.splice(i,1); level.pieces.push(p);
      sndPick(); break;
    }
  }
  ptrs.set(e.pointerId,{p:grabbed,dx:grabbed?grabbed.x-x:0,dy:grabbed?grabbed.y-y:0,
    x,y,x0:x,y0:y,t0:performance.now(),moved:0});
  try{ cvs.setPointerCapture(e.pointerId); }catch(err){}
}
function onMove(e){
  if(moveTouch(e))return;
  if(started&&appView==='game'&&level&&level.type==='numberdraw'&&handleNumberMove(e)) return;
  const d=ptrs.get(e.pointerId); if(!d) return;
  e.preventDefault();
  d.x=e.clientX; d.y=e.clientY;
  d.moved=Math.max(d.moved,Math.hypot(d.x-d.x0,d.y-d.y0));
  if(d.p && d.moved>14 && selected===d.p) selected=null;
  idleT=0;
}
function onUp(e){
  endTouch(e);
  if(started&&appView==='game'&&level&&level.type==='numberdraw'&&handleNumberUp(e)) return;
  const d=ptrs.get(e.pointerId); if(!d) return;
  d.x=e.clientX; d.y=e.clientY;
  d.moved=Math.max(d.moved,Math.hypot(d.x-d.x0,d.y-d.y0));
  ptrs.delete(e.pointerId);
  try{ if(cvs.hasPointerCapture(e.pointerId)) cvs.releasePointerCapture(e.pointerId); }catch(err){}
  if(phase!=='play'){ if(d.p) d.p.drag=false; return; }
  const isTap = d.moved<16 && (performance.now()-d.t0)<520;

  if(d.p){
    const p=d.p; p.drag=false;
    if(isTap){
      if(selected===p){ autoPlace(p); }            // ikinci dokunuş → kendi yuvasına uçar
      else { selected=p; sndSel(); mascotLook(p.x,p.y); }
      return;
    }
    const t=slotOf(p);
    const dropX=d.x+d.dx, dropY=d.y+d.dy-unit*0.10;
    if(t && !t.filled && Math.hypot(dropX-t.x,dropY-t.y)<unit*2.5){ place(p,t); return; }
    if(t && !t.filled) t.pulse=1;
    p.wig=0.5; sndSoft();
    return;
  }
  // boş alana dokunuş
  if(!isTap) return;
  if(Math.hypot(d.x-mas.x,d.y-mas.y)<mas.s*1.3){ mascotCheer(); sndGiggle(); buzz(8); return; }
  if(selected){
    for(const t of level.targets){
      if(t.filled||!hitSlot(t,d.x,d.y)) continue;
      if(t.key===selected.key) place(selected,t);
      else { t.pulse=1; sndSoft(); const own=slotOf(selected); if(own&&!own.filled) own.pulse=1; }
      return;
    }
  }
}
function onCancel(e){
  endTouch(e);
  if(started&&appView==='game'&&level&&level.type==='numberdraw'&&handleNumberUp(e)) return;
  const d=ptrs.get(e.pointerId); if(!d) return;
  ptrs.delete(e.pointerId);
  if(d.p){ d.p.drag=false; d.p.wig=0.25; }
}
function cancelAllPointers(){
  cancelStudioTouches(); cancelArcadeTouches();
  for(const id of touchPointers.keys()){try{cvs.releasePointerCapture(id);}catch(e){}}
  touchPointers.clear();
  if(level&&level.type==='numberdraw'){ level.drawGame.active=null; level.drawGame.pointerId=null; }
  ptrs.forEach(d=>{ if(d.p){ d.p.drag=false; d.p.wig=0.25; } });
  ptrs.clear();
}

cvs.addEventListener('keydown',e=>{
  if(!['Enter',' ','ArrowLeft','ArrowRight','Backspace','Delete'].includes(e.key)) return;
  e.preventDefault();
  if(!started){ startGame(); return; }
  if(appView!=='game'||!level) return;

  if(level.adventure){
    const g=level.adventure;
    if(e.key==='ArrowLeft'||e.key==='ArrowRight') g.focus=(g.focus+(e.key==='ArrowRight'?1:g.items.length-1))%g.items.length;
    if(e.key==='Enter'||e.key===' '){const p=g.items[g.focus];tapAdventure(p.x,p.y);}
    return;
  }
  if(level.type==='numberdraw'){
    if(e.key==='Backspace'||e.key==='Delete') clearNumberDrawing(true);
    return;
  }
  if(level.type==='memory'){
    const available=level.pieces.filter(p=>!p.placed&&!p.face);
    if(!available.length) return;
    if(e.key==='Enter'||e.key===' '){ revealMemoryCard(available.includes(selected)?selected:available[0]); return; }
    const current=Math.max(0,available.indexOf(selected)), direction=e.key==='ArrowRight'?1:-1;
    selected=available[(current+direction+available.length)%available.length]; sndSel(); mascotLook(selected.x,selected.y); return;
  }
  if(level.type==='pop'){
    const available=level.pieces;
    if(e.key==='Enter'||e.key===' '){ hitPopPiece(selected||available[0]); return; }
    const current=Math.max(0,available.indexOf(selected)), direction=e.key==='ArrowRight'?1:-1;
    selected=available[(current+direction+available.length)%available.length]; sndSel(); mascotLook(selected.x,selected.y); return;
  }
  const available=level.pieces.filter(p=>!p.placed&&!p.drag);
  if(!available.length) return;
  if(e.key==='Enter'||e.key===' '){
    if(selected) autoPlace(selected);
    else { selected=available[0]; sndSel(); mascotLook(selected.x,selected.y); }
    return;
  }
  const current=Math.max(0,available.indexOf(selected));
  const direction=e.key==='ArrowRight'?1:-1;
  selected=available[(current+direction+available.length)%available.length];
  sndSel(); mascotLook(selected.x,selected.y);
});

/* ---------------- döngü ---------------- */
let last=performance.now(), time=0;
function frame(now){
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,0.05);
  if(document.visibilityState==='hidden'||!resetSheet.hidden||!demoAd.hidden||!parentSheet.hidden){cancelAllPointers();requestAnimationFrame(frame);return;}
  time+=dt;
  updateParts(dt);

  if(!started){ drawStart(time); drawParts(); requestAnimationFrame(frame); return; }
  if(['menu','matchMenu','learnMenu','moreMenu'].includes(appView)){ drawGameMenu(time); requestAnimationFrame(frame); return; }
  if(appView!=='game'||!level){ requestAnimationFrame(frame); return; }
  phaseT+=dt;

  /* --- faz --- */
  if(phase==='intro'){
    level.pieces.forEach(p=>{ p.born=clamp(p.born+dt*(REDUCED?8:2.2),-1,1); });
    if(phaseT>(REDUCED?0.18:0.55+level.pieces.length*0.09)) phase='play';
  }
  if(phase==='play'){
    idleT+=dt;
    if(idleT>6.5 && !hintOn){
      hintOn=true;
      if(level.type==='numberdraw'){
        const g=level.drawGame; g.pulse=1;
        mascotLook(g.box.x+g.box.w/2,g.box.y+g.box.h/2); mas.bounce=0.7;
      }else{
        const p=selected||level.pieces.find(q=>!q.placed);
        if(p){ p.wig=0.7; const t=slotOf(p); if(t) t.pulse=1; mascotLook(t?t.x:p.x, t?t.y:p.y); mas.bounce=0.7; }
      }
    }
    if(hintOn && idleT>10.5){ idleT=0; hintOn=false; }
  }
  if(phase==='win'){
    // sırayla zıplayan kutlama dalgası
    const k=Math.floor((phaseT-0.35)/0.13);
    if(k>=0 && k<level.pieces.length && !waved[k]){
      waved[k]=true;
      const p=level.pieces.slice().sort((a,b)=>a.x-b.x)[k];
      if(p){ p.pop=1; note(PENTA[k%PENTA.length],0,0.35); }
    }
    if(phaseT>0.9 && !level.cheered){
      level.cheered=true; mascotCheer(); mas.bounce=1; buzz([25,45,25]);
      const cycleDone=(levelIndex+1)%TYPES.length===0;
      if(cycleDone){ stars++; sndStar(); if(!REDUCED) confetti(120); }
      else { sndWin(); if(!REDUCED) confetti(80); }
    }
    if(phaseT>2.1){
      level.fade=clamp((level.fade||0)+dt*1.8,0,1);
      level.pieces.forEach((p,i)=>{ p.out=clamp(p.out+dt*(1.3+i*0.12),0,1); });
    }
    if(phaseT>3.1&&!level.advanced){level.advanced=true;finishCompletedLevel();}
  }

  if(level.adventure){
    updateAdventure(dt); updateMascot(dt);
    if(level.adventure.tower) drawTower(time);
    else if(level.adventure.arcade) drawArcade(time);
    else { drawBackdrop(time); drawTopBar(time); drawMascot(time); drawAdventure(time); }
    drawParts();
    requestAnimationFrame(frame); return;
  }

  /* --- farklı etkileşimli modlar --- */
  if(level.type==='memory'||level.type==='pop'||level.type==='numberdraw'){
    if(level.type==='memory') updateMemory(dt);
    else if(level.type==='pop') updatePop(dt);
    else updateNumberDrawing(dt);
    if(!selected&&phase==='play') mascotLook(W*0.5,H*0.56);
    updateMascot(dt);

    drawBackdrop(time);
    drawTopBar(time); drawMascot(time);
    if(level.type==='memory') level.pieces.forEach(p=>drawMemoryCard(p,time));
    else if(level.type==='pop'){ drawPopTarget(time); level.pieces.forEach(p=>drawPopBubble(p,time)); }
    else drawNumberMode(time);
    drawParts();
    if(phase==='win'&&!REDUCED){
      const a=clamp(1-Math.abs(phaseT-1.05)/0.6,0,1)*0.32;
      if(a>0){ ctx.globalAlpha=a; ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
    }
    requestAnimationFrame(frame); return;
  }

  /* --- sürükleme + mıknatıs yardımı --- */
  let glowSet=new Set();
  ptrs.forEach(d=>{
    const p=d.p; if(!p||p.placed) return;
    let tx=d.x+d.dx, ty=d.y+d.dy-unit*0.10;
    const t=slotOf(p);
    if(t && !t.filled){
      const dist=Math.hypot(tx-t.x,ty-t.y);
      if(dist<unit*2.9){
        glowSet.add(t);
        const pull=clamp(1-dist/(unit*2.9),0,1)**2*0.42;   // yaklaşınca çekiyor
        tx+= (t.x-tx)*pull; ty+= (t.y-ty)*pull;
      }
    }
    p.x=ease(p.x,tx,34,dt); p.y=ease(p.y,ty,34,dt);
    mascotLook(p.x,p.y);
  });
  if(selected){ const t=slotOf(selected); if(t&&!t.filled) glowSet.add(t); }

  /* --- parçalar --- */
  level.pieces.forEach(p=>{
    const want=p.drag?1:(selected===p?0.55:0);
    p.lift=ease(p.lift,want,14,dt);
    p.pop=Math.max(0,p.pop-dt*2.1);
    p.wig=Math.max(0,p.wig-dt*1.05);
    if(selected===p && p.wig<0.05) p.wig=0.16;
    if(isAnimal(p.shape)){
      p.blink=Math.max(0,p.blink-dt*7); p.nextBlink-=dt;
      if(p.nextBlink<=0){ p.blink=1; p.nextBlink=rnd(2,6); }
    }
    if(!p.drag){
      const t=p.placed?slotOf(p):null;
      const tx=t?t.x:p.hx, ty=t?t.y:p.hy;
      p.x=ease(p.x,tx,p.placed?20:13,dt); p.y=ease(p.y,ty,p.placed?20:13,dt);
    }
  });
  level.targets.forEach(t=>{
    t.glow=ease(t.glow,glowSet.has(t)?1:0,11,dt);
    t.pulse=Math.max(0,t.pulse-dt*1.5);
  });
  if(ptrs.size===0 && !selected && phase==='play')
    mascotLook(W*0.5, H*0.5+Math.sin(time*0.5)*H*0.1);
  updateMascot(dt);

  /* --- çizim --- */
  drawBackdrop(time);
  drawTopBar(time);
  drawMascot(time);
  level.targets.forEach(t=>{ if(!t.filled) drawSlot(t,time); });
  level.pieces.forEach(p=>{ if(p.placed) drawPiece(p,time); });
  level.pieces.forEach(p=>{ if(!p.placed) drawPiece(p,time); });
  drawParts();

  if(phase==='win'&&!REDUCED){
    const a=clamp(1-Math.abs(phaseT-1.05)/0.6,0,1)*0.32;
    if(a>0){ ctx.globalAlpha=a; ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  }
  requestAnimationFrame(frame);
}
